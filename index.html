<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自宅健康管理サイネージ</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<main class="app">
 <section class="signage" aria-label="健康の推移">
  <header class="topbar"><div><div class="eyebrow">DAILY HEALTH / 自分の変化を見つける</div><h1>自宅健康管理サイネージ</h1></div><div class="metrics"><div>今日の睡眠<strong id="sleep">— <small>未接続</small></strong></div><div>今日の歩数<strong id="steps">— <small>未接続</small></strong></div><button id="export" class="quiet">書き出し</button><button id="import" class="quiet">読み込み</button><input id="import-file" type="file" accept="application/json" hidden></div></header>
  <article class="card main-chart"><div class="card-heading"><div><h2>状態推移</h2><span id="period" class="muted"></span></div><div class="legend"><span class="blue">● エネルギー</span><span class="green">● 気分</span><span class="purple">● 睡眠時間（右軸）</span></div></div><div class="plot"><canvas id="state-chart" aria-label="直近14日のエネルギー、気分、睡眠時間" role="img"></canvas><div id="empty" class="empty">記録した日から、変化が見えてきます。<small>未入力の日は空白のまま表示します</small></div></div></article>
  <div class="subcharts"><article class="card"><div class="card-heading"><h2>仕事時間</h2><span class="muted">時間 / 日</span></div><div class="plot"><canvas id="work-chart" aria-label="14日間の仕事時間" role="img"></canvas></div></article><article class="card"><div class="card-heading"><h2>趣味・副業・創作</h2><span class="muted">時間 / 日</span></div><div class="plot"><canvas id="hobby-chart" aria-label="14日間の趣味、副業、創作時間" role="img"></canvas></div></article><article class="card"><div class="card-heading"><h2>モヤモヤと現実対処力</h2></div><div class="small-legend"><span class="orange">● モヤモヤ 0–4</span><span class="blue">● 現実対処力 1–5</span></div><div class="plot"><canvas id="reality-chart" aria-label="14日間のモヤモヤ度と現実対処力" role="img"></canvas></div></article></div>
  <aside id="support" class="support" aria-live="polite"></aside>
 </section>
 <aside class="input-panel" aria-label="日々の入力">
  <header class="input-title"><h2 id="input-title">今日の入力</h2><span id="save-status" role="status">入力すると自動保存</span></header>
  <nav class="date-nav" aria-label="入力日"><button id="prev" aria-label="前の日">‹</button><input id="date" type="date" aria-label="入力する日付"><button id="next" aria-label="次の日">›</button><button id="today">今日</button><button id="copy">前日コピー</button></nav>
  <div id="fields"></div>
  <footer id="input-note">タップで記録 · 未選択の項目は未入力</footer>
 </aside>
</main>
<script type="module" src="/static/js/app.js"></script>
</body></html>
